<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tas Belanja — Noay’s Collection</title>
<meta name="theme-color" content="#F1D302">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>

<main class="section">
  <p class="crumb"><a href="index.html">Beranda</a> › Tas belanja</p>
  <div class="section-title"><div><p class="eyebrow">Your picks, your style</p><h1>Tas belanja <span id="shp"></span></h1></div><a class="underlink" href="category.html?type=Semua">← Lanjut belanja</a></div>
  <div class="cart-layout">
    <div><div id="cartItems" class="cart-list"></div><button class="clear-cart" id="clearCart" hidden>Kosongkan tas</button></div>
    <aside class="summary">
      <h2>Ringkasan belanja</h2>
      <div class="progress" aria-hidden="true"><i id="shipBar" style="width:0"></i></div>
      <p class="ship-hint" id="shipNote"></p>
      <div class="summary-row"><span>Subtotal</span><b id="subtotal">Rp0</b></div>
      <div class="summary-row"><span>Pengiriman</span><span id="shipCost">Dihitung saat checkout</span></div>
      <div class="summary-row total"><span>Total sementara</span><b id="total">Rp0</b></div>
      <button id="checkout" class="btn blue full">Checkout via WhatsApp</button>
      <p class="tiny">Pesananmu dikirim sebagai pesan WhatsApp ke toko. Pembayaran & ongkir dikonfirmasi oleh admin.</p>
    </aside>
  </div>
</main>
<div id="site-footer"></div>
